<!--

  One modal and one HubSpot form for every purple CTA. See README.md for setup, CTA links and QA.
  A button opts in with the CSS class wl-modal-cta and a link like /contact-us/?topic=project (optionally &v=workforce).
  Without JavaScript, or on old browsers, the link still goes to the Contact us page.

      ta.placeholder = c.msgHint;
      var lab = ta.id && root.querySelector('label[for="' + ta.id + '"]');
      if (lab) { var t = lab.querySelector('span') || lab; if (t.firstChild && t.firstChild.nodeType === 3) t.firstChild.nodeValue = c.msgLabel; else t.textContent = c.msgLabel; }
    }
    var btn = root.querySelector('button[type=submit], input[type=submit], .hsfc-Button');
    if (btn) { if (btn.tagName === 'INPUT') btn.value = c.submit; else btn.textContent = c.submit; }
  }
  window.addEventListener('hs-form-event:on-ready', function (e) {
    var api = window.HubSpotFormsV4 && HubSpotFormsV4.getFormFromEvent ? HubSpotFormsV4.getFormFromEvent(e) : null;
    if (api && api.getFormId && api.getFormId() !== H.formId) return;
    hsForm = api; clearTimeout(hsTimer);
    $('[data-loading-form]').hidden = true;
    applyToForm();
  });
  function onSent(firstName) {
    if (!d.open || state.sent) return;
    state.sent = true; if (firstName) state.firstName = firstName;
    track('submit');
    fillDone(panels.msg, state.cfg.ty);
  }
  window.addEventListener('hs-form-event:on-submission:success', function (e) {
    var api = window.HubSpotFormsV4 && HubSpotFormsV4.getFormFromEvent ? HubSpotFormsV4.getFormFromEvent(e) : null;
    if (api && api.getFormId && api.getFormId() !== H.formId) return;
    if (api && api.getFormFieldValues) {
      api.getFormFieldValues().then(function (vals) {
        var f = (vals || []).filter(function (v) { return /firstname$/.test(v.name); })[0];
        onSent(f && f.value ? String(f.value).trim() : '');
      }, function () { onSent(''); });
    } else onSent('');
  });

  /* ---------- HubSpot scheduler: one iframe, swapped to the topic's scheduler ---------- */
  function loadMeeting() {
    var url = WL_TALK.schedulers[state.cfg.sched] || WL_TALK.schedulers.general;
    if (url === meetUrl) return; meetUrl = url;
    var box = $('[data-meet]'), l = $('[data-loading-cal]'); l.hidden = false; l.textContent = WL_TALK.text.loadingCal;
    box.innerHTML = '';
    var f = document.createElement('iframe');
    f.title = 'Book a time with WeLearn';
    f.src = url + '?embed=true&parentHostname=' + encodeURIComponent(location.host) + '&parentPageUrl=' + encodeURIComponent(location.href.split('#')[0]);
    f.onload = function () { l.hidden = true; };
    box.appendChild(f);
  }
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/meetings\.hubspot\.com$/.test(e.origin) || !e.data) return;
    var f = $('[data-meet] iframe');
    if (f && e.data.height) f.style.height = e.data.height + 'px';
    if (e.data.meetingBookSucceeded) {
      track('booked', { scheduler: state.cfg.sched });
      // Topics with their own "booked" copy replace HubSpot's confirmation. Others keep HubSpot's.
      if (state.cfg.booked && d.open) { meetUrl = ''; fillDone(panels.book, state.cfg.booked); }
    }
  });

  /* ---------- Tabs ---------- */
  function selectTab(which, silent) {
    $$('[role="tab"]').forEach(function (t) {
      var on = t.getAttribute('data-tab') === which;
      t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
    if (which === 'book') loadMeeting(); else loadForm();
    if (!silent) track('tab', { tab: which });
  }
  $$('[role="tab"]').forEach(function (t) {
    t.addEventListener('click', function () { selectTab(t.getAttribute('data-tab')); });
    t.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var all = $$('[role="tab"]'), i = all.indexOf(t), n = all[(i + (e.key === 'ArrowRight' ? 1 : all.length - 1)) % all.length];
      selectTab(n.getAttribute('data-tab')); n.focus();
    });
  });

  /* ---------- Open and close ---------- */
  function open(topic, variant, label, opener) {
    if (!T[topic]) topic = 'general';
    state.topic = topic; state.variant = variant || ''; state.label = label; state.opener = opener;
    var c = state.cfg = cfgFor(topic, variant);
    $('[data-f="eyebrow"]').textContent = c.eyebrow;
    $('[data-f="title"]').textContent = c.title;
    $('[data-f="copy"]').textContent = c.copy;
    // The topic's first choice sits on the left
    var tl = $('.wl-talk__tabs'); tl.insertBefore($('#wl-talk-tab-' + c.mode), tl.firstChild);
    // After one submission, later opens show HubSpot's own fallback thank-you in place of the form
    setState(panels.msg, 'form'); setState(panels.book, 'form');
    if (meetUrl === '') $('[data-meet]').innerHTML = '';
    applyToForm();
    selectTab(c.mode, true);
    d.showModal();
    track('open', { first_tab: c.mode, page: location.pathname });
  }
  function close() {
    if (!d.open || d.classList.contains('is-closing')) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { d.close(); return; }
    d.classList.add('is-closing');
    setTimeout(function () { d.classList.remove('is-closing'); d.close(); }, 280);
  }
  d.addEventListener('cancel', function (e) { e.preventDefault(); close(); });
  d.addEventListener('close', function () {
    track('close');
    if (state.opener && state.opener.focus) state.opener.focus({ preventScroll: true });
  });
  d.addEventListener('click', function (e) {
    if (e.target === d || e.target.closest('[data-close]')) { close(); return; }
    var g = e.target.closest('[data-goto]');
    if (g) { var w = g.getAttribute('data-goto'); setState(panels[w], 'form'); selectTab(w); $('#wl-talk-tab-' + w).focus(); }
    var a = e.target.closest('[data-track-done]'); if (a) track('thankyou_click', { label: a.getAttribute('data-track-done') });
  });

  /* ---------- Buttons: any link with class wl-modal-cta (on the link or its Elementor widget) and ?topic= ---------- */
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var w = e.target.closest('.wl-modal-cta'); if (!w) return;
    var a = w.tagName === 'A' ? w : (e.target.closest('a') || w.querySelector('a')); if (!a) return;
    var q; try { q = new URL(a.href, location.href).searchParams; } catch (err) { return; }
    var topic = w.getAttribute('data-topic') || q.get('topic'); if (!topic) return;
    e.preventDefault();
    var label = (a.textContent || '').replace(/\s+/g, ' ').trim();
    open(topic, w.getAttribute('data-variant') || q.get('v') || '', label, a);
  });
})();
</script>
